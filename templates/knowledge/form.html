{% extends "base.html" %}
{% block content %}
<section class="page-header">
    <h2>
        <span class="icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m6 17.313 5.657-5.657 2.828 2.828L8.828 20.14H6v-2.828Zm-.707-2.121 9.9-9.9a1 1 0 0 1 1.414 0l2.121 2.122a1 1 0 0 1 0 1.414l-9.9 9.9A2 2 0 0 1 6 20H4v-2a2 2 0 0 1 .586-1.414Z" />
            </svg>
        </span>
        {% if item %}Edit{% else %}Add{% endif %} Knowledge Item
    </h2>
    <a class="btn secondary" href="/admin/knowledge">
        <span class="icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M19 11H8.414l3.293-3.293-1.414-1.414L4.586 12l5.707 5.707 1.414-1.414L8.414 13H19v-2Z" />
            </svg>
        </span>
        Back to list
    </a>
</section>

<form method="post" class="knowledge-form card">
    <div class="form-sections">
        <div class="form-section">
            <div class="section-heading">
                <span class="icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M6 2h9a3 3 0 0 1 3 3v15h-2V5a1 1 0 0 0-1-1H6V2Zm0 4h9a3 3 0 0 1 3 3v11h-2v-7a1 1 0 0 0-1-1H6V6Zm0 4h7a3 3 0 0 1 3 3v9H9a3 3 0 0 1-3-3v-9Zm2 2v6a1 1 0 0 0 1 1h5v-4a3 3 0 0 0-3-3H8Z" />
                    </svg>
                </span>
                O‘zbek tili
            </div>
            <div class="form-row">
                <div class="form-field">
                    <label for="question_uz">
                        <span class="icon">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M6 2h9a3 3 0 0 1 3 3v15h-2V5a1 1 0 0 0-1-1H6V2Zm0 4h9a3 3 0 0 1 3 3v11h-2v-7a1 1 0 0 0-1-1H6V6Zm0 4h7a3 3 0 0 1 3 3v9H9a3 3 0 0 1-3-3v-9Zm2 2v6a1 1 0 0 0 1 1h5v-4a3 3 0 0 0-3-3H8Z" />
                            </svg>
                        </span>
                        Question (UZ)
                    </label>
                    <input id="question_uz" name="question_uz" value="{{ item.question_uz | default('') }}" required>
                </div>
                <div class="form-field textarea-field">
                    <label for="answer_uz">
                        <span class="icon">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M5 5h14a2 2 0 0 1 2 2v12l-4-3H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Zm0 2v7h12l2 1.5V7H5Z" />
                            </svg>
                        </span>
                        Answer (UZ)
                    </label>
                    <textarea id="answer_uz" name="answer_uz" rows="4" required>{{ item.answer_uz | default('') }}</textarea>
                </div>
            </div>
        </div>
        <div class="form-section">
            <div class="section-heading">
                <span class="icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M6 2h9a3 3 0 0 1 3 3v15h-2V5a1 1 0 0 0-1-1H6V2Zm0 4h9a3 3 0 0 1 3 3v11h-2v-7a1 1 0 0 0-1-1H6V6Zm0 4h7a3 3 0 0 1 3 3v9H9a3 3 0 0 1-3-3v-9Zm2 2v6a1 1 0 0 0 1 1h5v-4a3 3 0 0 0-3-3H8Z" />
                    </svg>
                </span>
                Русский язык
            </div>
            <div class="form-row">
                <div class="form-field">
                    <label for="question_ru">
                        <span class="icon">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M6 2h9a3 3 0 0 1 3 3v15h-2V5a1 1 0 0 0-1-1H6V2Zm0 4h9a3 3 0 0 1 3 3v11h-2v-7a1 1 0 0 0-1-1H6V6Zm0 4h7a3 3 0 0 1 3 3v9H9a3 3 0 0 1-3-3v-9Zm2 2v6a1 1 0 0 0 1 1h5v-4a3 3 0 0 0-3-3H8Z" />
                            </svg>
                        </span>
                        Question (RU)
                    </label>
                    <input id="question_ru" name="question_ru" value="{{ item.question_ru | default('') }}" required>
                </div>
                <div class="form-field textarea-field">
                    <label for="answer_ru">
                        <span class="icon">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M5 5h14a2 2 0 0 1 2 2v12l-4-3H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Zm0 2v7h12l2 1.5V7H5Z" />
                            </svg>
                        </span>
                        Answer (RU)
                    </label>
                    <textarea id="answer_ru" name="answer_ru" rows="4" required>{{ item.answer_ru | default('') }}</textarea>
                </div>
            </div>
        </div>
        <div class="form-section">
            <div class="section-heading">
                <span class="icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M6 2h9a3 3 0 0 1 3 3v15h-2V5a1 1 0 0 0-1-1H6V2Zm0 4h9a3 3 0 0 1 3 3v11h-2v-7a1 1 0 0 0-1-1H6V6Zm0 4h7a3 3 0 0 1 3 3v9H9a3 3 0 0 1-3-3v-9Zm2 2v6a1 1 0 0 0 1 1h5v-4a3 3 0 0 0-3-3H8Z" />
                    </svg>
                </span>
                Қазақ тілі
            </div>
            <div class="form-row">
                <div class="form-field">
                    <label for="question_kz">
                        <span class="icon">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M6 2h9a3 3 0 0 1 3 3v15h-2V5a1 1 0 0 0-1-1H6V2Zm0 4h9a3 3 0 0 1 3 3v11h-2v-7a1 1 0 0 0-1-1H6V6Zm0 4h7a3 3 0 0 1 3 3v9H9a3 3 0 0 1-3-3v-9Zm2 2v6a1 1 0 0 0 1 1h5v-4a3 3 0 0 0-3-3H8Z" />
                            </svg>
                        </span>
                        Question (KZ)
                    </label>
                    <input id="question_kz" name="question_kz" value="{{ item.question_kz | default('') }}" required>
                </div>
                <div class="form-field textarea-field">
                    <label for="answer_kz">
                        <span class="icon">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M5 5h14a2 2 0 0 1 2 2v12l-4-3H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Zm0 2v7h12l2 1.5V7H5Z" />
                            </svg>
                        </span>
                        Answer (KZ)
                    </label>
                    <textarea id="answer_kz" name="answer_kz" rows="4" required>{{ item.answer_kz | default('') }}</textarea>
                </div>
            </div>
        </div>
        <div class="form-section">
            <div class="section-heading">
                <span class="icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M5 4h14a1 1 0 0 1 .894 1.447L15.618 16.106A3 3 0 0 1 12.894 18H7.106a3 3 0 0 1-2.724-1.894L4.106 15H3a1 1 0 1 1 0-2h1l3.447-8.106A1 1 0 0 1 8.382 4H5Z" />
                    </svg>
                </span>
                Category
            </div>
            <div class="form-row single">
                <div class="form-field">
                    <label for="category">
                        <span class="icon">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M5 4h14a1 1 0 0 1 .894 1.447L15.618 16.106A3 3 0 0 1 12.894 18H7.106a3 3 0 0 1-2.724-1.894L4.106 15H3a1 1 0 1 1 0-2h1l3.447-8.106A1 1 0 0 1 8.382 4H5Z" />
                            </svg>
                        </span>
                        Category
                    </label>
                    <input id="category" name="category" value="{{ item.category | default('') }}" placeholder="Optional">
                </div>
            </div>
        </div>
    </div>
    <div class="form-actions">
        <button type="submit" class="btn">
            <span class="icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M5 5h14a2 2 0 0 1 2 2v12l-4-3H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Zm0 2v7h12l2 1.5V7H5Z" />
                </svg>
            </span>
            Save Item
        </button>
        <a class="btn secondary" href="/admin/knowledge">
            Cancel
        </a>
    </div>
</form>
{% endblock %}
