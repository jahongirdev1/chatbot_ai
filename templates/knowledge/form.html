{% extends "base.html" %}
{% block content %}
<h2>{% if item %}✏️ Edit{% else %}➕ Add{% endif %} Knowledge Item</h2>
<form method="post" class="knowledge-form">
    <label>Question (UZ):</label><br>
    <input name="question_uz" value="{{ item.question_uz | default('') }}" required><br>
    <label>Answer (UZ):</label><br>
    <textarea name="answer_uz" rows="4" required>{{ item.answer_uz | default('') }}</textarea><br><br>

    <label>Question (RU):</label><br>
    <input name="question_ru" value="{{ item.question_ru | default('') }}" required><br>
    <label>Answer (RU):</label><br>
    <textarea name="answer_ru" rows="4" required>{{ item.answer_ru | default('') }}</textarea><br><br>

    <label>Question (KZ):</label><br>
    <input name="question_kz" value="{{ item.question_kz | default('') }}" required><br>
    <label>Answer (KZ):</label><br>
    <textarea name="answer_kz" rows="4" required>{{ item.answer_kz | default('') }}</textarea><br><br>

    <label>Category:</label><br>
    <input name="category" value="{{ item.category | default('') }}"><br><br>

    <button type="submit">💾 Save</button>
</form>
{% endblock %}
